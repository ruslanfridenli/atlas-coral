<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Coral — Memepad Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🚀 atlas coral — memepad studio</h1><nav class="lang"><button data-lang="en" class="on">EN</button><button data-lang="de">DE</button></nav></header>
<main><aside class="panel">
<section><h2 data-i="token">Token</h2>
<label><span data-i="name">Name</span><input type="text" id="name" value="catcoin"></label>
<label><span data-i="symbol">Symbol</span><input type="text" id="symbol" value="$CAT" maxlength="6"></label>
<label><span data-i="supply">Supply</span><input type="number" id="supply" value="1000000000"></label></section>
<section><h2 data-i="launch">Launch</h2>
<div class="btncol"><button id="deploy" class="primary" data-i="deploy">🚀 Deploy to bonding curve</button></div></section>
<section><h2 data-i="stats">Live stats</h2><div class="stats" id="stats">—</div></section>
</aside><div class="stage"><canvas id="cv"></canvas><div class="banner" id="banner" style="display:none"></div></div></main>
<script src="app.js"></script></body></html>
